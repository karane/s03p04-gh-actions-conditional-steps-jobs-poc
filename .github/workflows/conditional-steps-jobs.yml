name: Conditional Steps & Jobs

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Run tests (may fail)
        id: run-tests
        run: python3 -m pytest tests/ -v

      # success() is the implicit default `if:` on every step, shown here
      # explicitly — only runs when every previous step in the job succeeded.
      - name: On success
        if: success()
        run: echo "Build succeeded"

      # failure() only runs after something earlier in the job has failed.
      - name: On failure
        if: failure()
        run: echo "Build failed — notifying"

      # always() runs regardless of outcome, even after a cancellation —
      # the natural spot for cleanup that must never be skipped.
      - name: Always clean up
        if: always()
        run: echo "Cleaning up temp files"

      # cancelled() only runs if the workflow run was cancelled mid-job.
      - name: On cancellation
        if: cancelled()
        run: echo "Run was cancelled"

      # Skipping based on event context: only push events to main, not PRs,
      # get this step — no boolean function needed, plain expressions work too.
      - name: Only on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Direct push to main detected"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # Job-level `if:` skips the ENTIRE job — deploy only runs for pushes to
    # main, never for pull_request events, regardless of what `build` did.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "Deploying to production"
